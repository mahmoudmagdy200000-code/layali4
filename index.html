  <!-- Preload Logo to prevent FOUC -->
  <link rel="preload" href="/assets/logo.png" as="image" type="image/png" />
  <!-- Theme Hydration Script to prevent FOUC -->
  <script>
    (function() {
      try {
        var localTheme = localStorage.getItem('theme');
        var sysTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (localTheme === 'dark' || (!localTheme && sysTheme)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
